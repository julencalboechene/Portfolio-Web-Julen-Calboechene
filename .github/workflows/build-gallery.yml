name: Actualizar galería

# Se ejecuta cada vez que subís/cambiás/borrás algo dentro de images/gallery/
# en la rama main, y también se puede disparar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - "images/gallery/**"
  workflow_dispatch: {}

# Necesario para que el propio Action pueda commitear el JSON actualizado.
permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar data/gallery.json
        run: node build-gallery.js

      - name: Commitear el resultado si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la galería, no hago commit."
          else
            git commit -m "Actualizar galería automáticamente"
            git push
          fi
